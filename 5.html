<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>六子棋 · 3D 馬卡龍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    background: #1a120c;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #canvas { display: block; width: 100vw; height: 100vh; }

  .ui {
    position: fixed; left: 0; right: 0; z-index: 10;
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .ui > * { pointer-events: auto; }
  .ui-top { top: 0; padding: calc(14px + env(safe-area-inset-top)) 16px 14px 16px; }
  .ui-bottom { bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)) 16px; }

  .title {
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 800;
    letter-spacing: 6px;
    color: #f8e8d0;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.4);
  }

  .players {
    display: flex; gap: 6px;
    background: rgba(248,232,208,0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: 5px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.15) inset;
  }
  .player {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px 5px 7px;
    border-radius: 999px;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0.5;
  }
  .player.active { opacity: 1; background: rgba(58,40,24,0.12); transform: scale(1.05); }
  .player.winner {
    opacity: 1;
    background: linear-gradient(135deg, #ffe9ab, #ffc947);
    box-shadow: 0 0 0 2px #c89000;
    animation: winGlow 1.2s ease infinite;
  }
  @keyframes winGlow {
    0%, 100% { box-shadow: 0 0 0 2px rgba(200,144,0,1), 0 0 0 4px rgba(255,215,0,0.5); }
    50% { box-shadow: 0 0 0 2px rgba(200,144,0,1), 0 0 0 12px rgba(255,215,0,0); }
  }

  .macaron-icon {
    width: 24px; height: 20px; position: relative; flex-shrink: 0;
  }
  .macaron-icon::before, .macaron-icon::after {
    content: ''; position: absolute; left: 0; right: 0;
    height: 9px; border-radius: 999px 999px 40% 40%;
  }
  .macaron-icon::after { bottom: 0; border-radius: 40% 40% 999px 999px; }
  .macaron-icon .cream {
    position: absolute; top: 7px; left: 1px; right: 1px; height: 6px;
    border-radius: 50%;
  }
  .macaron-icon.red::before, .macaron-icon.red::after { background: #e91e4a; }
  .macaron-icon.red .cream { background: #ffc5d5; }
  .macaron-icon.blue::before, .macaron-icon.blue::after { background: #1e6fe8; }
  .macaron-icon.blue .cream { background: #b8d0f5; }
  .macaron-icon.yellow::before, .macaron-icon.yellow::after { background: #f9b700; }
  .macaron-icon.yellow .cream { background: #ffe8a8; }

  .player-name { font-size: 13px; font-weight: 700; color: #3a2818; letter-spacing: 1px; }
  .player-count { font-size: 11px; color: #8a6a4a; font-weight: 600; min-width: 10px; text-align: right; }

  .status {
    font-size: 14px; color: #3a2818; font-weight: 600; letter-spacing: 1px;
    background: rgba(248,232,208,0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.15) inset;
  }

  .controls { display: flex; gap: 10px; }
  button {
    padding: 10px 22px; border: none; border-radius: 999px;
    background: rgba(248,232,208,0.95); color: #3a2818;
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
  }
  button:hover:not(:disabled) { transform: translateY(-1px); background: #fff4dc; box-shadow: 0 9px 22px rgba(0,0,0,0.5); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .win-banner {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    background: rgba(248,232,208,0.98);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    padding: 30px 44px; border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.2) inset;
    z-index: 20; text-align: center;
    opacity: 0; pointer-events: none;
    transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: 260px;
  }
  .win-banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .win-title { font-size: 28px; font-weight: 800; color: #3a2818; margin-bottom: 6px; letter-spacing: 4px; }
  .win-subtitle { font-size: 13px; color: #8a6a4a; margin-bottom: 22px; letter-spacing: 2px; }

  .hint {
    position: fixed; bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(248,232,208,0.55);
    letter-spacing: 1.5px; pointer-events: none; z-index: 5;
    text-align: center; transition: opacity 0.5s;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .hint.hide { opacity: 0; }

  .version {
    position: fixed; bottom: 4px; right: 8px;
    font-size: 10px; color: rgba(248,232,208,0.35);
    z-index: 30; pointer-events: none; letter-spacing: 1px;
  }

  @media (max-width: 420px) {
    .title { letter-spacing: 4px; }
    .player { padding: 4px 9px 4px 5px; }
    .player-name { font-size: 12px; letter-spacing: 0; }
    button { padding: 9px 16px; letter-spacing: 1px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="ui ui-top">
  <div class="title">六子棋</div>
  <div class="players" id="players">
    <div class="player active" data-player="0">
      <div class="macaron-icon red"><div class="cream"></div></div>
      <div class="player-name">紅</div>
      <div class="player-count" id="count-0">0</div>
    </div>
    <div class="player" data-player="1">
      <div class="macaron-icon blue"><div class="cream"></div></div>
      <div class="player-name">藍</div>
      <div class="player-count" id="count-1">0</div>
    </div>
    <div class="player" data-player="2">
      <div class="macaron-icon yellow"><div class="cream"></div></div>
      <div class="player-name">黃</div>
      <div class="player-count" id="count-2">0</div>
    </div>
  </div>
</div>

<div class="hint" id="hint">拖曳旋轉視角 · 雙指縮放 · 點擊下棋</div>

<div class="ui ui-bottom">
  <div class="status" id="status">紅色馬卡龍請下棋</div>
  <div class="controls">
    <button id="undoBtn">悔棋</button>
    <button id="restartBtn">重新開始</button>
  </div>
</div>

<div class="win-banner" id="winBanner">
  <div class="win-title" id="winTitle">紅色馬卡龍獲勝！</div>
  <div class="win-subtitle">連成六顆馬卡龍</div>
  <button id="playAgainBtn">再來一局</button>
</div>

<div class="version">v2.2.0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ======== Scene ========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a120c);
scene.fog = new THREE.Fog(0x1a120c, 25, 55);

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;  // reduced so colors stay vivid

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);

// ======== Camera ========
const cam = { theta: 0.15, phi: 0.88, distance: 16, target: new THREE.Vector3(0, 0, 0) };
function updateCamera() {
  const { theta, phi, distance, target } = cam;
  camera.position.x = target.x + distance * Math.sin(phi) * Math.sin(theta);
  camera.position.y = target.y + distance * Math.cos(phi);
  camera.position.z = target.z + distance * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(target);
}
updateCamera();

// ======== Lights (ambient reduced for vivid colors) ========
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
scene.add(new THREE.HemisphereLight(0xfff0d4, 0x2a1a10, 0.22));

const keyLight = new THREE.DirectionalLight(0xfff4dc, 1.35);
keyLight.position.set(7, 14, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffddb3, 0.35);
fillLight.position.set(-6, 5, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xb8d4ff, 0.3);
rimLight.position.set(0, 3, -9);
scene.add(rimLight);

const cafeLamp = new THREE.PointLight(0xffcc88, 0.55, 14, 2);
cafeLamp.position.set(0, 7, 2);
scene.add(cafeLamp);

// ======== Textures ========
const BOARD_SIZE = 10;
const CELL = 1;
const BOARD_HALF = BOARD_SIZE / 2;

function makeGridTexture() {
  const size = 1024;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0a0908';
  ctx.fillRect(0, 0, size, size);
  const cellPx = size / BOARD_SIZE;
  ctx.fillStyle = 'rgba(255,255,255,0.015)';
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if ((r + c) % 2 === 0) ctx.fillRect(c * cellPx, r * cellPx, cellPx, cellPx);
    }
  }
  ctx.strokeStyle = 'rgba(255,248,232,0.55)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i <= BOARD_SIZE; i++) {
    const p = Math.round(i * cellPx) + 0.5;
    ctx.beginPath();
    ctx.moveTo(p, 0); ctx.lineTo(p, size);
    ctx.moveTo(0, p); ctx.lineTo(size, p);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,248,232,0.6)';
  for (const [gx, gy] of [[3,3],[3,7],[7,3],[7,7],[5,5]]) {
    ctx.beginPath();
    ctx.arc(gx * cellPx, gy * cellPx, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}

function makeWoodTexture() {
  const W = 1024, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#2a170a');
  grad.addColorStop(0.4, '#382112');
  grad.addColorStop(0.5, '#3d2416');
  grad.addColorStop(0.7, '#361e10');
  grad.addColorStop(1, '#281509');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 240; i++) {
    const baseX = Math.random() * W;
    const hue = 18 + Math.random() * 14;
    const sat = 25 + Math.random() * 25;
    const light = 6 + Math.random() * 14;
    const alpha = 0.15 + Math.random() * 0.4;
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
    ctx.lineWidth = 0.4 + Math.random() * 2.2;
    ctx.beginPath();
    let x = baseX;
    ctx.moveTo(x, 0);
    for (let y = 0; y < H; y += 6) {
      x += (Math.random() - 0.5) * 0.9;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 22; i++) {
    const baseX = Math.random() * W;
    ctx.strokeStyle = `hsla(28, 35%, ${22 + Math.random()*10}%, ${0.18 + Math.random()*0.18})`;
    ctx.lineWidth = 1.5 + Math.random() * 3;
    ctx.beginPath();
    let x = baseX;
    ctx.moveTo(x, 0);
    for (let y = 0; y < H; y += 8) {
      x += (Math.random() - 0.5) * 1.4;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = 40 + Math.random() * 70;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(5,2,0,0.55)');
    g.addColorStop(0.4, 'rgba(8,4,0,0.28)');
    g.addColorStop(1, 'rgba(10,5,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.strokeStyle = `rgba(20,10,4,${0.25 + Math.random()*0.2})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.3, r * 0.45, Math.random() * 0.3, 0, Math.PI * 2);
    ctx.stroke();
  }
  const imgData = ctx.getImageData(0, 0, W, H);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 14;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n * 0.9));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n * 0.8));
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

const gridTex = makeGridTexture();
const woodTex = makeWoodTexture();

// ======== Wood table ========
const tableGeo = new THREE.BoxGeometry(34, 0.6, 34);
const tableMat = new THREE.MeshStandardMaterial({
  map: woodTex,
  roughness: 0.72,
  metalness: 0.04,
});
const table = new THREE.Mesh(tableGeo, tableMat);
table.position.y = -0.86;
table.receiveShadow = true;
scene.add(table);

// ======== Black porcelain plate ========
const plateSize = BOARD_SIZE + 2;
const plateGeo = new THREE.BoxGeometry(plateSize, 0.55, plateSize, 2, 1, 2);
const plateMat = new THREE.MeshStandardMaterial({
  color: 0x171717,
  roughness: 0.22,
  metalness: 0.08,
});
const plate = new THREE.Mesh(plateGeo, plateMat);
plate.position.y = -0.275;
plate.receiveShadow = true;
plate.castShadow = true;
scene.add(plate);

const topGeo = new THREE.PlaneGeometry(BOARD_SIZE, BOARD_SIZE);
const topMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: gridTex,
  roughness: 0.28,
  metalness: 0.08,
});
const topPlane = new THREE.Mesh(topGeo, topMat);
topPlane.rotation.x = -Math.PI / 2;
topPlane.position.y = 0.003;
topPlane.receiveShadow = true;
scene.add(topPlane);

// ======== Macaron (plump, all-rounded via LatheGeometry) ========
const MACARON = {
  R: 0.38,        // shell max radius
  shellH: 0.32,   // shell height (tall & plump)
  creamR: 0.40,   // cream radius (wider than shell base so it pokes out)
  creamH: 0.18,   // cream height (chunky)
  cornerR: 0.075, // cream corner radius
};
MACARON.restY = MACARON.shellH + MACARON.creamH / 2;

// Shell profile: plump dome, widest near base, curls in at the very bottom (rounded foot)
function makeShellProfile(R, H) {
  const pts = [
    [0.00, 1.00],  // top center (slightly rounded top)
    [0.18, 0.995],
    [0.34, 0.97],
    [0.50, 0.92],
    [0.65, 0.84],
    [0.77, 0.73],
    [0.87, 0.60],
    [0.94, 0.46],
    [0.98, 0.32],
    [1.00, 0.18],  // widest, just above base
    [0.99, 0.10],  // starting to curl in
    [0.95, 0.05],
    [0.88, 0.015],
    [0.78, 0.00],  // base edge (narrower than widest)
    [0.00, 0.00],  // close at center — flat base hidden inside the cream
  ];
  return pts.map(([x, y]) => new THREE.Vector2(x * R, y * H));
}

// Cream profile: rounded-edge disc (no sharp cylinder edges)
function makeCreamProfile(R, H, cornerR) {
  const points = [];
  const arcSegs = 12;
  const halfH = H / 2;

  points.push(new THREE.Vector2(0.0001, halfH));
  points.push(new THREE.Vector2(R - cornerR, halfH));

  // Top-right quarter arc
  for (let i = 1; i <= arcSegs; i++) {
    const a = (i / arcSegs) * Math.PI / 2;
    const x = R - cornerR + Math.sin(a) * cornerR;
    const y = halfH - cornerR + Math.cos(a) * cornerR;
    points.push(new THREE.Vector2(x, y));
  }

  // Down the right side
  points.push(new THREE.Vector2(R, -halfH + cornerR));

  // Bottom-right quarter arc
  for (let i = 1; i <= arcSegs; i++) {
    const a = (i / arcSegs) * Math.PI / 2;
    const x = R - cornerR + Math.cos(a) * cornerR;
    const y = -halfH + cornerR - Math.sin(a) * cornerR;
    points.push(new THREE.Vector2(x, y));
  }

  points.push(new THREE.Vector2(0.0001, -halfH));
  return points;
}

const macaronGeo = {
  shell: new THREE.LatheGeometry(makeShellProfile(MACARON.R, MACARON.shellH), 48),
  cream: new THREE.LatheGeometry(makeCreamProfile(MACARON.creamR, MACARON.creamH, MACARON.cornerR), 48),
};
macaronGeo.shell.computeVertexNormals();
macaronGeo.cream.computeVertexNormals();

// Vivid macaron colors — pure red / blue / yellow feel
const MACARON_COLORS = [
  { shell: 0xe91e4a, cream: 0xffc5d5, name: '紅色' },  // raspberry red
  { shell: 0x1e6fe8, cream: 0xb8d0f5, name: '藍色' },  // cobalt blue
  { shell: 0xf9b700, cream: 0xffe8a8, name: '黃色' },  // amber yellow
];

const macaronMats = MACARON_COLORS.map(c => ({
  shell: new THREE.MeshStandardMaterial({
    color: c.shell,
    roughness: 0.5,
    metalness: 0.0,
  }),
  cream: new THREE.MeshStandardMaterial({
    color: c.cream,
    roughness: 0.82,
    metalness: 0.0,
  }),
}));

function createMacaron(player) {
  const group = new THREE.Group();
  const { shell: shellMat, cream: creamMat } = macaronMats[player];
  const { creamH, shellH } = MACARON;

  // Top shell: base at top of cream
  const top = new THREE.Mesh(macaronGeo.shell, shellMat);
  top.position.y = creamH / 2;
  top.castShadow = true;

  // Bottom shell: flipped, base at bottom of cream
  const bot = new THREE.Mesh(macaronGeo.shell, shellMat);
  bot.rotation.x = Math.PI;
  bot.position.y = -creamH / 2;
  bot.castShadow = true;

  // Cream filling — rounded disc
  const cream = new THREE.Mesh(macaronGeo.cream, creamMat);
  cream.castShadow = true;

  group.add(bot, cream, top);
  group.userData.player = player;
  return group;
}

// ======== Hover indicator (desktop) ========
const hoverGeo = new THREE.CircleGeometry(MACARON.creamR * 0.95, 32);
const hoverMat = new THREE.MeshBasicMaterial({
  color: 0xe91e4a,
  transparent: true,
  opacity: 0.55,
});
const hoverDisc = new THREE.Mesh(hoverGeo, hoverMat);
hoverDisc.rotation.x = -Math.PI / 2;
hoverDisc.position.y = 0.005;
hoverDisc.visible = false;
scene.add(hoverDisc);

// ======== Game state ========
const WIN_COUNT = 6;
let board, currentPlayer, moveHistory, gameOver, winningCells;
const liveMacarons = {};

function cellKey(r, c) { return r + ',' + c; }
function inBounds(r, c) { return r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE; }
function cellToWorld(r, c) {
  return { x: (c - BOARD_HALF + 0.5) * CELL, z: (r - BOARD_HALF + 0.5) * CELL };
}

function newGame() {
  Object.values(liveMacarons).forEach(m => scene.remove(m));
  for (const k in liveMacarons) delete liveMacarons[k];
  board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(-1));
  currentPlayer = 0;
  moveHistory = [];
  gameOver = false;
  winningCells = [];
  winBannerEl.classList.remove('show');
  updateUI();
}

function tryMove(r, c) {
  if (gameOver || board[r][c] !== -1) return;
  board[r][c] = currentPlayer;
  moveHistory.push({ r, c, player: currentPlayer });
  placeMacaron(r, c, currentPlayer);
  const win = checkWin(r, c, currentPlayer);
  if (win) {
    winningCells = win;
    gameOver = true;
    updateUI();
    setTimeout(showWinner, 700);
    return;
  }
  if (moveHistory.length === BOARD_SIZE * BOARD_SIZE) {
    gameOver = true;
    updateUI();
    statusEl.textContent = '平手！';
    return;
  }
  currentPlayer = (currentPlayer + 1) % 3;
  updateUI();
}

function undo() {
  if (moveHistory.length === 0) return;
  const last = moveHistory.pop();
  board[last.r][last.c] = -1;
  currentPlayer = last.player;
  gameOver = false;
  winningCells = [];
  const k = cellKey(last.r, last.c);
  const m = liveMacarons[k];
  if (m) { scene.remove(m); delete liveMacarons[k]; }
  winBannerEl.classList.remove('show');
  updateUI();
}

function placeMacaron(r, c, player) {
  const m = createMacaron(player);
  const { x, z } = cellToWorld(r, c);
  const targetY = MACARON.restY;
  m.position.set(x, targetY + 4, z);
  m.rotation.y = Math.random() * Math.PI * 2;
  scene.add(m);
  liveMacarons[cellKey(r, c)] = m;
  animateDrop(m, targetY);
}

function animateDrop(m, targetY) {
  const startY = m.position.y;
  const t0 = performance.now();
  const dur = 480;
  function step() {
    const t = Math.min((performance.now() - t0) / dur, 1);
    m.position.y = startY + (targetY - startY) * easeOutBounce(t);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}
function easeOutBounce(t) {
  const n = 7.5625, d = 2.75;
  if (t < 1/d) return n*t*t;
  if (t < 2/d) return n*(t-=1.5/d)*t + 0.75;
  if (t < 2.5/d) return n*(t-=2.25/d)*t + 0.9375;
  return n*(t-=2.625/d)*t + 0.984375;
}

function checkWin(r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    const line = [{ r, c }];
    let nr = r + dr, nc = c + dc;
    while (inBounds(nr, nc) && board[nr][nc] === player) { line.push({ r: nr, c: nc }); nr += dr; nc += dc; }
    nr = r - dr; nc = c - dc;
    while (inBounds(nr, nc) && board[nr][nc] === player) { line.unshift({ r: nr, c: nc }); nr -= dr; nc -= dc; }
    if (line.length >= WIN_COUNT) return line;
  }
  return null;
}

// ======== UI ========
const statusEl = document.getElementById('status');
const undoBtn = document.getElementById('undoBtn');
const restartBtn = document.getElementById('restartBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const winBannerEl = document.getElementById('winBanner');
const winTitleEl = document.getElementById('winTitle');
const hintEl = document.getElementById('hint');

function updateUI() {
  document.querySelectorAll('.player').forEach((el, i) => {
    el.classList.remove('active', 'winner');
    if (gameOver && winningCells.length > 0) {
      const winnerIdx = board[winningCells[0].r][winningCells[0].c];
      if (i === winnerIdx) el.classList.add('winner');
    } else if (!gameOver && i === currentPlayer) {
      el.classList.add('active');
    }
  });
  const counts = [0, 0, 0];
  for (const m of moveHistory) counts[m.player]++;
  counts.forEach((n, i) => document.getElementById('count-' + i).textContent = n);
  if (gameOver && winningCells.length > 0) {
    const w = board[winningCells[0].r][winningCells[0].c];
    statusEl.textContent = `${MACARON_COLORS[w].name}馬卡龍連成六顆，獲勝！`;
  } else if (gameOver) {
    statusEl.textContent = '平手！';
  } else {
    statusEl.textContent = `${MACARON_COLORS[currentPlayer].name}馬卡龍請下棋`;
  }
  hoverMat.color.setHex(MACARON_COLORS[currentPlayer].shell);
  undoBtn.disabled = moveHistory.length === 0;
}

function showWinner() {
  const w = board[winningCells[0].r][winningCells[0].c];
  winTitleEl.textContent = `${MACARON_COLORS[w].name}馬卡龍獲勝！`;
  winBannerEl.classList.add('show');
}

// ======== Raycast pick ========
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function pickCell(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(topPlane);
  if (hits.length === 0) return null;
  const p = hits[0].point;
  const c = Math.floor(p.x / CELL + BOARD_HALF);
  const r = Math.floor(p.z / CELL + BOARD_HALF);
  if (!inBounds(r, c)) return null;
  return { r, c };
}

// ======== Orbit + tap + pinch ========
let isDown = false, didDrag = false;
let startX = 0, startY = 0, lastX = 0, lastY = 0;
let lastPinch = 0;
const activePointers = new Map();
let firstInteraction = false;

function hideHintOnce() {
  if (!firstInteraction) {
    firstInteraction = true;
    hintEl.classList.add('hide');
    setTimeout(() => hintEl.remove(), 600);
  }
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  hoverDisc.visible = false;
  if (activePointers.size === 1) {
    isDown = true; didDrag = false;
    startX = lastX = e.clientX; startY = lastY = e.clientY;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (lastPinch > 0) {
      cam.distance *= lastPinch / d;
      cam.distance = Math.max(7, Math.min(28, cam.distance));
      updateCamera();
    }
    lastPinch = d;
    didDrag = true;
    return;
  }
  if (!isDown) {
    if (e.pointerType === 'mouse' && !gameOver) {
      const cell = pickCell(e.clientX, e.clientY);
      if (cell && board[cell.r][cell.c] === -1) {
        const { x, z } = cellToWorld(cell.r, cell.c);
        hoverDisc.position.x = x;
        hoverDisc.position.z = z;
        hoverDisc.visible = true;
      } else {
        hoverDisc.visible = false;
      }
    }
    return;
  }
  if (activePointers.size !== 1) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (!didDrag && Math.hypot(e.clientX - startX, e.clientY - startY) > 6) didDrag = true;
  if (didDrag) {
    cam.theta -= dx * 0.007;
    cam.phi -= dy * 0.007;
    cam.phi = Math.max(0.12, Math.min(Math.PI / 2 - 0.05, cam.phi));
    updateCamera();
    hideHintOnce();
  }
  lastX = e.clientX; lastY = e.clientY;
});

function endPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) lastPinch = 0;
  if (isDown && !didDrag && activePointers.size === 0) {
    const cell = pickCell(e.clientX, e.clientY);
    if (cell) { tryMove(cell.r, cell.c); hideHintOnce(); }
  }
  if (activePointers.size === 0) isDown = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', (e) => {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) { isDown = false; lastPinch = 0; }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.distance += e.deltaY * 0.018;
  cam.distance = Math.max(7, Math.min(28, cam.distance));
  updateCamera();
  hideHintOnce();
}, { passive: false });

undoBtn.addEventListener('click', undo);
restartBtn.addEventListener('click', newGame);
playAgainBtn.addEventListener('click', newGame);

// ======== Render loop ========
function animate() {
  requestAnimationFrame(animate);
  if (gameOver && winningCells.length > 0) {
    const t = performance.now() * 0.0022;
    winningCells.forEach((cell, i) => {
      const m = liveMacarons[cellKey(cell.r, cell.c)];
      if (m) {
        const ph = t + i * 0.55;
        m.position.y = MACARON.restY + Math.abs(Math.sin(ph)) * 0.32;
        m.rotation.y += 0.015;
      }
    });
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

newGame();
</script>
